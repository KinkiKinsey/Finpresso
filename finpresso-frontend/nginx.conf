# finpresso-frontend/nginx.conf

error_log  /dev/stderr  debug;

server {
    listen 80;
    server_name _;

    # ① 静态根目录 & 首页
    root  /usr/share/nginx/html;
    index index.html;      # <- 一定要有这一行

    include /etc/nginx/mime.types;

    # ② SPA 回落 & 静态文件
    location / {
        # 先尝试文件，再尝试目录，最后回落到 index.html
        try_files $uri $uri/ /index.html;
    }

    # ③ 缓存静态资源
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # ④ 如需 /api 反代，可在此解除注释并调整
    #location /api/ {
    #    proxy_pass http://backend:8000/api/;
    #    ...
    #}
}

